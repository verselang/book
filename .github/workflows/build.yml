name: Build MkDocs

on:
  workflow_call:      # Allow other workflows to call this
    inputs:
      upload:
        description: 'Whether to upload the compiled artifact'
        required: false
        default: false
        type: boolean
  workflow_dispatch:  # Allow Manual Trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            docs
            api_docs
            verse_lexer
            mkdocs.yml
            mkapi_docs.yml
            requirements.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Build MkDocs site
        run: |
          cp -r docs/{Assets,images,js,extra.css,VerseSyntaxValidation.md} api_docs/ # copy stuff from docs to api_docs

          mkdocs build -f mkdocs.yml -d ./site
          mkdocs build -f mkapi_docs.yml -d ./site/api

      - name: Upload artifact
        if: ${{ inputs.upload }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
